name: agent-store

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agent_store
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - agent-store-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ../agent-store-be
      dockerfile: ../agent-store-infra/docker/api/Dockerfile
    restart: unless-stopped
    env_file: ../agent-store-be/.env
    environment:
      SPRING_PROFILES_ACTIVE: dev,docker
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RUNTIME_TOKEN_SECRET: ${RUNTIME_TOKEN_SECRET}
      X402_PRIVATE_KEY: ${X402_PRIVATE_KEY}
    ports:
      - "8080:8080"
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  demo-agent:
    build:
      context: ../demo-agent
      dockerfile: ../agent-store-infra/docker/demo-agent/Dockerfile
    restart: unless-stopped
    env_file: ../demo-agent/.env
    environment:
      DEMO_AGENT_HOST: 0.0.0.0
      DEMO_AGENT_PORT: 8090
    network_mode: service:api
    depends_on:
      api:
        condition: service_started
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  agent-store-postgres-data:
    name: agent-store-postgres-data
